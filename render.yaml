services:
  - type: web
    name: sothis-echo-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: API_PORT
        value: 8080
      - key: CORS_ORIGIN
        value: https://sothisecho.vercel.app,https://*.vercel.app,http://localhost:3002,http://127.0.0.1:3002
      # Required for the NISAR L-band browse images (ASF / Earthdata).
      - key: EARTHDATA_TOKEN
        sync: false
      # Optional: GeoAI analysis endpoint.
      - key: GEOAI_BASE_URL
        sync: false
